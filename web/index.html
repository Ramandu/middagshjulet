<head>
<meta charset="utf-8">

<style>
:root{
  --bg:#EDF1EE; --surface:#FFFFFF; --surface2:#F6F8F6; --ink:#15221E; --muted:#5A6B65; --line:#D4DDD8;
  --accent:#0E5A4E; --accent-ink:#FFFFFF; --accent-soft:#DCEBE6; --mark:#F4C44A; --mark-ink:#2B2000;
  --veg:#35702A; --veg-bg:#E2EFDA; --fisk:#1D5A87; --fisk-bg:#DCE9F4; --ny:#76399A; --ny-bg:#EEE2F5;
  --helg:#8E5400; --helg-bg:#F8E9CF; --tex:#9E3A2A; --tex-bg:#F7E0DA; --rest:#5A6B65; --rest-bg:#E7ECE9;
  --shadow:0 1px 2px rgba(20,40,34,.06),0 6px 24px rgba(20,40,34,.07);
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1613; --surface:#16211D; --surface2:#1B2823; --ink:#E5EEEA; --muted:#93A69E; --line:#2A3A34;
    --accent:#5BC1AC; --accent-ink:#06201A; --accent-soft:#1D3730; --mark:#E2B243; --mark-ink:#241A00;
    --veg:#9BD08A; --veg-bg:#1E3219; --fisk:#8CC0E8; --fisk-bg:#162B3C; --ny:#D2A6EC; --ny-bg:#2D1D38;
    --helg:#EDB968; --helg-bg:#35270F; --tex:#F0A08F; --tex-bg:#3A1C16; --rest:#93A69E; --rest-bg:#22302B;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1613; --surface:#16211D; --surface2:#1B2823; --ink:#E5EEEA; --muted:#93A69E; --line:#2A3A34;
  --accent:#5BC1AC; --accent-ink:#06201A; --accent-soft:#1D3730; --mark:#E2B243; --mark-ink:#241A00;
  --veg:#9BD08A; --veg-bg:#1E3219; --fisk:#8CC0E8; --fisk-bg:#162B3C; --ny:#D2A6EC; --ny-bg:#2D1D38;
  --helg:#EDB968; --helg-bg:#35270F; --tex:#F0A08F; --tex-bg:#3A1C16; --rest:#93A69E; --rest-bg:#22302B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 72px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(28px,7vw,40px);font-weight:800;line-height:1.02}
h2{font-size:22px;font-weight:800}
h3{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-family:var(--body)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;flex-direction:column;gap:10px}
.top .sub{color:var(--muted);margin:0}
.now{display:flex;gap:12px;align-items:flex-start;background:var(--mark);color:var(--mark-ink);border-radius:14px;padding:12px 14px}
.now b{font-family:var(--display);font-weight:800;font-size:17px;display:block}
.now span{font-size:14px}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;margin-inline:-16px;padding-inline:16px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:15px;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--mark);margin-left:6px;vertical-align:middle}
.panel{display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.weekhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 12px}
.weekhead .dates{color:var(--muted);font-variant-numeric:tabular-nums}
.balance{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--muted)}
.days{list-style:none;margin:0;padding:0}
.day{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.day.today{background:var(--accent-soft)}
.dn{display:flex;flex-direction:column;line-height:1.1}
.dn b{font-family:var(--display);font-weight:800;font-size:17px}
.dn small{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.dish{display:flex;flex-direction:column;gap:4px;min-width:0}
.dish .name{font-weight:700;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:12.5px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:700;letter-spacing:.01em}
.c-veg{color:var(--veg);background:var(--veg-bg)} .c-fisk{color:var(--fisk);background:var(--fisk-bg)} .c-ny{color:var(--ny);background:var(--ny-bg)}
.c-helg{color:var(--helg);background:var(--helg-bg)} .c-tex{color:var(--tex);background:var(--tex-bg)} .c-rest{color:var(--rest);background:var(--rest-bg)}
.c-bytta{color:var(--accent);background:var(--accent-soft)}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:7px 12px;font-size:14px;font-weight:700}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:5px 10px;font-size:13px}
.shop{padding:14px;display:flex;flex-direction:column;gap:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 6px;font-weight:700;font-size:14px;line-height:1.2}
.seg button small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow)}
.seg button[aria-pressed="true"] small{color:var(--ink)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.tools .left{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.tools .right{display:flex;gap:8px;flex-wrap:wrap}
.group h3{margin-bottom:4px}
.items{list-style:none;margin:0;padding:0}
.item{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px dashed var(--line)}
.item:last-child{border-bottom:0}
.item input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:0 0 auto;margin:0}
.item label{flex:1;display:flex;justify-content:space-between;gap:10px;align-items:baseline;cursor:pointer;min-width:0}
.item .nm{overflow-wrap:anywhere}
.item .for{display:block;font-size:12px;color:var(--muted)}
.item .q{font-family:var(--mono);font-size:13.5px;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink)}
.item.done .nm,.item.done .q{text-decoration:line-through;color:var(--muted)}
.tagmini{font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-left:6px;text-transform:uppercase;letter-spacing:.05em}
.x{border:0;background:none;color:var(--muted);font-size:18px;padding:0 4px;line-height:1}
.addrow{display:flex;gap:8px}
.addrow input,.field input,.field textarea{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:10px;padding:9px 11px;font:inherit;font-size:15px}
.empty{color:var(--muted);font-size:14px;margin:0}
.note{font-size:14px;color:var(--muted);margin:0}
.hint{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--muted)}
.hint b{color:var(--ink)}
details.dishrow{border-top:1px solid var(--line)}
details.dishrow:first-of-type{border-top:0}
details.dishrow summary{list-style:none;display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px 14px;cursor:pointer;align-items:center}
details.dishrow summary::-webkit-details-marker{display:none}
details.dishrow summary .used{font-size:12.5px;color:var(--muted);text-align:right;white-space:nowrap}
.dishbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.dishbody ul{margin:0;padding-left:18px}
.cardhead{padding:14px 14px 4px;display:flex;flex-direction:column;gap:4px}
.pantry{display:flex;flex-wrap:wrap;gap:8px;padding:14px}
.pchip{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:7px 12px;font-size:14px}
.pchip[aria-pressed="true"]{background:var(--mark);color:var(--mark-ink);border-color:var(--mark);font-weight:700}
.form{padding:14px;display:flex;flex-direction:column;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:700}
.field textarea{min-height:110px;font-weight:400}
.checks{display:flex;gap:8px;flex-wrap:wrap}
.checks label{display:flex;gap:6px;align-items:center;font-weight:400;font-size:14px}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(8,16,13,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .inner{background:var(--surface);width:100%;max-width:640px;max-height:85%;border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .shead{padding:14px 16px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.sheet .shead .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.filters{display:flex;gap:6px;overflow-x:auto}
.filters button{flex:0 0 auto}
.sheet .list{overflow-y:auto;padding:4px 0}
.opt{display:grid;grid-template-columns:1fr auto;gap:8px;width:100%;text-align:left;border:0;background:none;padding:11px 16px;border-top:1px solid var(--line);align-items:center}
.opt:first-child{border-top:0}
.opt:hover{background:var(--surface2)}
.opt.cur{background:var(--accent-soft)}
.opt .used{font-size:12.5px;color:var(--muted);white-space:nowrap}
.linkish{border:0;background:none;padding:0;text-align:left;font-weight:700;color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.linkish:hover{text-decoration-color:var(--accent)}
.rlink{color:var(--accent);font-weight:700;text-decoration:none}
.rlink:hover{text-decoration:underline}
.sheet .form.edlist{overflow-y:auto}
.field input{font-weight:400}
.eyebrow{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.search{width:100%;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;font-size:16px}
#pantry-res .pantry{padding:0}
.gname{font-size:11px;color:var(--muted);margin-left:4px}
.pchip[aria-pressed="true"] .gname{color:var(--mark-ink)}
.addnew{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--muted);margin-top:8px}
.addnew select{border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:8px;padding:6px 8px;font:inherit;font-size:14px}
details.shelf{border-top:1px solid var(--line)}
details.shelf summary,details.sjekk summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;cursor:pointer}
details.shelf summary::-webkit-details-marker,details.sjekk summary::-webkit-details-marker{display:none}
details.shelf .pantry{padding:0 14px 8px}
.shelftools{padding:0 14px 12px}
details.sjekk{border:1px solid var(--line);border-radius:12px;background:var(--surface2)}
details.sjekk summary{padding:10px 12px}
details.sjekk > p,details.sjekk > ul{margin:0;padding:0 12px 10px}
.pchip.small{padding:4px 10px;font-size:13px;flex:0 0 auto}
.addrow.wrap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.addrow.wrap input{grid-column:1/-1;flex:none}
.secsel{border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:8px;padding:6px 8px;font:inherit;font-size:13px;max-width:100%;min-width:0}
.item .secsel{flex:0 1 11em;width:11em}
.item > .nm{min-width:0}
.btn[disabled]{opacity:.35;cursor:default}
.item .btn.small{padding:3px 9px}
.daypick{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.daypick .note{margin-right:2px}
.dchip{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:5px 9px;font-size:13.5px;font-weight:700;line-height:1.15;text-align:center;min-width:44px}
.dchip small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.dchip.istoday small{color:var(--accent);font-weight:700}
.dchip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dchip[aria-pressed="true"] small{color:var(--accent-ink)}
.toast{display:flex;align-items:center;gap:12px;pointer-events:none}
.toast .toastbtn{pointer-events:auto}
.toastbtn{border:0;background:var(--mark);color:var(--mark-ink);font-weight:700;border-radius:8px;padding:5px 10px;font-size:14px;flex:0 0 auto}
button,label,summary,select,input,a,.item{touch-action:manipulation}
.c-kj{color:var(--muted);background:var(--surface2);border:1px solid var(--line)}
.wizard{padding:18px 16px;display:flex;flex-direction:column;gap:16px}
.wizard h2{font-size:24px}
.wizhead{display:flex;flex-direction:column;gap:8px}
.wizbar{height:6px;border-radius:6px;background:var(--surface2);overflow:hidden}
.wizbar span{display:block;height:100%;background:var(--accent)}
.wiznav{display:flex;justify-content:space-between;gap:10px;padding-top:6px;border-top:1px solid var(--line)}
.stepper{display:flex;align-items:center;gap:14px;margin-top:6px}
.stepper b{font-family:var(--display);font-size:24px;min-width:2ch;text-align:center}
.wzdays{display:flex;flex-direction:column;gap:10px}
.wzday{display:flex;flex-direction:column;gap:6px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface2)}
.search.small{padding:7px 10px;font-size:14px}
.wzgroup{display:flex;flex-direction:column;gap:4px}
.wzgroup .row{display:flex;justify-content:space-between;align-items:center}
.counter{margin:0;font-size:14px;color:var(--muted)}
.summary{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.suggest{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.field .daypick{margin-top:6px}
.startchoice{display:flex;flex-direction:column;gap:6px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface2)}
.startchoice h3{font-size:15px;color:var(--ink);text-transform:none;letter-spacing:0}
.qr{display:flex;justify-content:center;padding:10px;background:#fff;border-radius:12px;width:max-content;margin:0 auto}
details.leave summary{cursor:pointer}
.pplrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pplrow .stepper{margin-top:0}
.pplweek{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.pplgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.pplgrid label{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted)}
.pplgrid select{width:100%;padding:4px 2px;text-align:center}
.foot{font-size:13px;color:var(--muted);text-align:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
textarea.copyfb{width:100%;min-height:160px;font-family:var(--mono);font-size:13px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--ink);padding:8px}
@media (prefers-reduced-motion:no-preference){.sheet .inner{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
.sheet.top{flex-direction:column;justify-content:flex-start;align-items:center}
.sheet.top .inner{border-radius:0 0 18px 18px;padding-top:env(safe-area-inset-top,0px);padding-bottom:0}
.addhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.secchips{display:flex;flex-wrap:wrap;gap:6px}
.btn.addopen{display:block;width:calc(100% - 28px);margin:10px 14px 14px;padding:11px 12px;font-size:15px}
@media (pointer:coarse){input:not([type=checkbox]):not([type=radio]),select,textarea{font-size:16px!important}}
.mvbtn{flex:0 0 auto;border:1px solid var(--line);background:var(--surface2);color:var(--muted);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
.sheet .list.news{padding:6px 16px 4px}
.news section{padding:8px 0}
.news h3{margin-bottom:6px}
.newsitem{padding:6px 0 10px;border-bottom:1px solid var(--line)}
.newsitem:last-child{border-bottom:0}
.newsitem .note{margin-top:2px}
.sheet.still .inner{animation:none}
.newsfoot{padding:10px 16px 14px;border-top:1px solid var(--line);display:flex;justify-content:flex-end}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1 id="ttl">Middagshjulet</h1>
    <p class="sub" id="sub"></p>
    <div class="now" id="now"></div>
  </header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Visning"></nav>
  <main class="panel" id="panel"></main>
  <p class="foot" id="foot"></p>
</div>
<div id="sheet" hidden></div>
<div id="toast" class="toast" hidden></div>

<script src="firebase-config.js"></script>
<script>
(function(){
"use strict";
// ---------- Husstand (lenken er nøkkelen) ----------
const HID_RX = /h=([A-Za-z0-9]{20,40})/;
function readHid(){ const m = location.hash.match(HID_RX); try{ if(m){ localStorage.setItem('mh-hid', m[1]); return m[1]; } const v = localStorage.getItem('mh-hid'); return v && /^[A-Za-z0-9]{20,40}$/.test(v) ? v : null; }catch(e){ return m ? m[1] : null; } }
const HID = readHid();
if(HID && !HID_RX.test(location.hash)){ try{ history.replaceState(null,'','#h='+HID); }catch(e){} }
function newHid(){ const a='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789'; const r=new Uint8Array(24); crypto.getRandomValues(r); let o=''; r.forEach(x=>{ o+=a[x%62]; }); return o; }
function shareLink(){ return location.origin + location.pathname + '#h=' + HID; }
const HAS_BACKEND = !!(window.FIREBASE_CONFIG && window.FIREBASE_CONFIG.apiKey && !/LIM_INN/.test(window.FIREBASE_CONFIG.apiKey));
// ---------- Data ----------
const DOW_S = ['Søn','Man','Tir','Ons','Tor','Fre','Lør'];
const DOW_L = ['søndag','mandag','tirsdag','onsdag','torsdag','fredag','lørdag'];

  refAbs = Math.floor(Math.max(daysSince,0)/7); curAbs = daysSince>=0 ? Math.floor(daysSince/7) : -1; curW = curAbs>=0 ? curAbs%4 : -1;
  daysToShop = (7-di)%7; nextShopW = ((Math.floor((daysSince+daysToShop)/7)%4)+4)%4;
}

// ---------- Helpers ----------
function scaleQ(q,u,f){ const x=q*f; if(u==='g') return x>=100 ? Math.round(x/50)*50 : Math.max(10, Math.round(x/10)*10); if(['dl','ss','ts','l'].indexOf(u)>=0) return Math.max(0.5, Math.round(x*2)/2); return Math.max(1, Math.round(x)); }
function scaleDish(d, n){ n = n || CFG.servings || 4; const f=n/(d.p||5); if(Math.abs(f-1)<0.01) return d; const sc=r=>{ const x=r.slice(); if(r[1]!=null) x[1]=scaleQ(r[1],r[2],f); return x; }; return Object.assign({}, d, {i:(d.i||[]).map(sc), k:(d.k||[]).map(sc), p:n}); }
function allDishes(n){ const o = {}; const E = S.plan.edits||{}; for(const k in D){ o[k] = scaleDish(E[k] ? Object.assign({}, D[k], {k:[]}, E[k]) : D[k], n); } for(const k in S.plan.custom){ const c=S.plan.custom[k]; if(c) o[k]=scaleDish(c, n); } return o; }
// Antall personer: unntak for en dag, ellers ukas antall, ellers det vanlige.
function servingsWeek(w){ const v = CFG.ppl && CFG.ppl[w]; return v>0 ? v : CFG.servings; }
function servingsAt(w,d){ const v = CFG.pplDay && CFG.pplDay[w+'-'+d]; return v>0 ? v : servingsWeek(w); }
// Retten slik den skal lages den dagen, regnet om til antall personer da.
function dishScaler(){ const cache={}; return (w,d)=>{ const n=servingsAt(w,d); const all=cache[n]||(cache[n]=allDishes(n)); return all[dishAt(w,d)]; }; }
function dishAt(w,d){ const k = S.plan.swaps[w+'-'+d]; const all = allDishes(); return (k && all[k]) ? k : baseAt(w,d); }
function usage(id){ const u=[]; for(let w=0;w<4;w++) for(let d=0;d<7;d++) if(dishAt(w,d)===id) u.push('Uke '+(w+1)+' '+DAYN[d].toLowerCase()); return u; }
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function cz(d){ return d && d.c ? '<span class="chip c-kj">'+esc(d.c)+'</span>' : ''; }
function chips(tags){ return (tags||[]).filter(t=>t!=='ny').map(t=>'<span class="chip c-'+t+'">'+esc(TAGS[t]||t)+'</span>').join(''); }
function qtyStr(q,u){
  if(q==null) return '';
  if(u==='g'){ return q>=1000 ? String(+(q/1000).toFixed(2)).replace('.',',')+' kg' : q+' g'; }
  const n = String(+q.toFixed(2)).replace('.',',');
  return n+' '+(q>1 && PLURAL[u] ? PLURAL[u] : u);
}
function weekDoc(w){ const d=S.w[w]||{}; return d.occ===absFor(w) ? d : {occ:absFor(w),checked:{},extra:{}}; }
function setWeek(w, patch){
  const d = S.w[w]||{};
  if(d.occ!==absFor(w)){ const fresh = merge({occ:absFor(w),checked:{},extra:{}}, patch); write('app/w'+w, fresh, true); }
  else write('app/w'+w, patch, false);
}
function fasteList(){ const ov=S.basis.fasteSec||{}; const l = FASTE.filter(f=>!S.basis.fasteOff[f[0]]).map(f=>({id:f[0],n:f[1],s:ov[f[0]]||f[2]})); for(const k in S.basis.fasteAdd){ const v=S.basis.fasteAdd[k]; if(v) l.push({id:k,n:v.n,s:v.s||'a',custom:1}); } return l; }
function autoSec(n){ const l=n.toLowerCase(); if(/banan|eple|appelsin|klementin|frukt|drue|pære|agurk|tomat|salat|paprika|løk|potet|gulr|brokkoli|kål|avokado|sitron|lime|bær|squash|sopp|urter|koriander|spinat|mango|kiwi|melon/.test(l)) return 'g'; if(/gryn|müsli|musli|kornblanding|cornflakes/.test(l)) return 't'; for(const [s,re] of GUESS) if(re.test(l)) return s; return 'a'; }
function secSelect(id, val, attrs){ return '<select id="'+id+'" class="secsel" '+(attrs||'')+' aria-label="Avdeling">'+(val==null?'<option value="">Finn avdeling selv</option>':'')+secOrder().map(k=>'<option value="'+k+'"'+(k===val?' selected':'')+'>'+secName(k)+'</option>').join('')+'</select>'; }
function basisList(){ const off=S.basis.basisOff||{}; const l = BASIS.filter(b=>!off[b[0]]).map(b=>({id:b[0],n:b[1],g:b[2]})); for(const k in S.basis.basisAdd){ const v=S.basis.basisAdd[k]; if(v) l.push({id:k,n:v.n,g:v.g||guessGroup(v.n),custom:1}); } return l; }
function pantryByName(n){ const l=n.trim().toLowerCase(); return basisList().find(b=>b.n.toLowerCase()===l); }
function pantryNames(){ const m={}; basisList().forEach(b=>{ m[b.n.toLowerCase()]=b; }); return m; }
function skapNeeds(w, days){ const dishOn=dishScaler(); const out={}; const PN=pantryNames(); for(let d=0; d<7; d++){ if(days && days.indexOf(d)<0) continue; const dish=dishOn(w,d); if(!dish) continue; const mult=(d===CFG.doubleDay&&doubleOn(w))?2:1; (dish.k||[]).concat((dish.i||[]).filter(r=>PN[r[0].toLowerCase()])).forEach(r=>{ const key=r[0].toLowerCase(); const o=out[key]||(out[key]={n:r[0],parts:{},for:[]}); if(r[1]!=null){ o.parts[r[2]]=(o.parts[r[2]]||0)+r[1]*mult; } if(o.for.indexOf(DAYN[d])<0) o.for.push(DAYN[d]); }); } return out; }
function needQty(o){ return Object.keys(o.parts).map(u=>qtyStr(o.parts[u],u)).join(' + '); }
function toggleLowByName(n){ const b=pantryByName(n); if(b){ write('app/basis',{low:{[b.id]:!S.basis.low[b.id]}}); } else { const id='u'+Date.now().toString(36); write('app/basis',{basisAdd:{[id]:{n:n,g:guessGroup(n)}}, low:{[id]:true}}); } }

function buildList(w, days, incl){
  const dishOn = dishScaler(); const wd = weekDoc(w);
  const out = {stor:{}, paafyll:{}};
  const OV = S.basis.itemSec||{};
  function add(target, key, item){ if(item.n && OV[item.n.toLowerCase()]) item.s=OV[item.n.toLowerCase()]; item.s=resolveSec(item.s); const b=out[target]; if(b[key]){ if(item.tag && !b[key].tag) b[key].tag=item.tag; if(item.fresh) b[key].fresh=1; if(item.q!=null) b[key].q=(b[key].q||0)+item.q; item.for.forEach(f=>{ if(b[key].for.indexOf(f)<0) b[key].for.push(f); }); } else b[key]=item; }
  const PN = pantryNames();
  for(let d=0; d<7; d++){
    if(days && days.indexOf(d)<0) continue;
    const dish = dishOn(w,d); if(!dish) continue;
    (dish.i||[]).forEach(r=>{
      if(PN[r[0].toLowerCase()]) return; // står i skapet: havner på sjekklista
      const late = r[4] && d>=3;
      const target = (CFG.padDay>=0 && r[4] && d>CFG.padDay && SHORT_RE.test(r[0])) ? 'paafyll' : 'stor';
      const mult = (d===CFG.doubleDay && doubleOn(w)) ? 2 : 1;
      add(target, 'i|'+r[0]+'|'+r[2], {n:r[0], q:r[1]==null?null:r[1]*mult, u:r[2], s:r[3]||'a', for:[DAYN[d]+(mult>1?' ×2':'')], tag:(late && target==='stor') ? 'sjekk dato' : undefined, fresh:r[4]?1:0});
    });
  }
  for(const k in (wd.extra||{})){ const e=wd.extra[k]; if(e) add(e.t||'stor','x|'+k,{n:e.n,s:e.s||'a',for:[],tag:'ekstra',extra:k}); }
  if(days && !incl) return applyMoves(out, wd);
  fasteList().forEach(f=>add('stor','f|'+f.id,{n:f.n,s:f.s,for:[],tag:'fast'}));
  // Det som er tomt i skapet, kommer på neste handletur: storhandelen, eller påfyllet hvis storhandelen
  // denne uka allerede er gjort (fra dagen etter handledagen til og med påfyllsdagen).
  const di = ((daysSince%7)+7)%7;
  const lowTarget = (w===curW && CFG.padDay>=0 && di>0 && di<=CFG.padDay) ? 'paafyll' : 'stor';
  const needs = skapNeeds(w, days); basisList().forEach(b=>{ const k='b|'+b.id; const inStor=!!wd.checked['stor|'+k], inPad=!!wd.checked['paafyll|'+k];
    // Krysset av = kjøpt. Er den merket tom igjen etterpå, er det et nytt behov til neste tur.
    const targets = new Set(); if(inStor) targets.add('stor'); if(inPad) targets.add('paafyll');
    if(S.basis.low[b.id] && !(lowTarget==='stor' ? inStor : inPad)) targets.add(lowTarget);
    if(!targets.size) return; const nd=needs[b.n.toLowerCase()];
    targets.forEach(t=>add(t,k,{n:b.n,s:b.g==='annet'?'a':'t',for:nd?nd.for.slice():[],tag:'tomt',basis:b.id,qs:nd?needQty(nd):''})); });
  return applyMoves(out, wd);
}
// Varer dere har flyttet mellom storhandel og påfyll for én bestemt uke (ukedokumentets «move»).
function applyMoves(out, wd){
  if(CFG.padDay<0) return out;
  const M = wd.move||{};
  for(const k in M){ const to=M[k]; if(to!=='paafyll' && to!=='stor') continue;
    const from = to==='paafyll' ? 'stor' : 'paafyll'; const it = out[from][k]; if(!it) continue;
    delete out[from][k]; it.moved = to; if(to==='paafyll' && it.tag==='sjekk dato') it.tag = undefined;
    const b = out[to][k];
    if(b){ if(it.q!=null) b.q=(b.q||0)+it.q; (it.for||[]).forEach(f=>{ if(b.for.indexOf(f)<0) b.for.push(f); }); b.moved=to; }
    else out[to][k] = it; }
  return out;
}

function generatePlan(cfg){
  const all = allDishes(); const has=(id,t)=>((all[id]&&all[id].tags)||[]).indexOf(t)>=0;
  let pool = (cfg.selected||Object.keys(all)).filter(id=>all[id] && id!=='rest');
  if(pool.length<3) pool = Object.keys(all).filter(id=>id!=='rest');
  const used={}; pool.forEach(id=>used[id]=0);
  const dowOf = d => (cfg.shopDow+d)%7; const wknd = d => { const x=dowOf(d); return x===0||x===6; };
  const quick = d => !!(cfg.quick&&cfg.quick[d]);
  const isQ = id => { const m=minutes(all[id].t); return m>0 && m<=(cfg.maxMin||25); };
  const base=[];
  for(let w=0; w<4; w++){
    const row=new Array(7).fill(null); let veg=0, fish=0; const inWeek=new Set();
    if(cfg.restDay>=0) row[cfg.restDay]='rest';
    const order=[]; const push=d=>{ if(row[d]==null && order.indexOf(d)<0) order.push(d); };
    if(cfg.themeDay>=0) push(cfg.themeDay);
    for(let d=0;d<7;d++) if(quick(d)) push(d);
    for(let d=0;d<7;d++) if(wknd(d)) push(d);
    for(let d=0;d<7;d++) push(d);
    order.forEach((d,idx)=>{
      const remaining=order.length-idx; const needVeg=Math.max(0,(cfg.veg||0)-veg), needFish=Math.max(0,(cfg.fish||0)-fish);
      let c = pool.filter(id=>!inWeek.has(id));
      if(!c.length) c = pool.slice();
      if(d===cfg.themeDay){ const t=c.filter(id=>has(id,cfg.themeTag)); if(t.length) c=t; }
      if(quick(d)){ const t=c.filter(isQ); if(t.length) c=t; }
      const score=id=>{ let sc=used[id]*10; const m=minutes(all[id].t)||40;
        if(wknd(d)){ if(has(id,'helg')||m>45) sc-=3; } else { if(has(id,'helg')) sc+=4; if(m>45) sc+=3; }
        if(needVeg>0 && has(id,'veg')) sc -= (needVeg>=remaining?20:4);
        if(needFish>0 && has(id,'fisk')) sc -= (needFish>=remaining?20:4);
        if(cfg.themeDay>=0 && d!==cfg.themeDay && has(id,cfg.themeTag) && cfg.themeTag==='tex') sc+=6;
        return sc+Math.random(); };
      c.sort((a,b)=>score(a)-score(b)); const pick=c[0];
      row[d]=pick; used[pick]=(used[pick]||0)+1; inWeek.add(pick); if(has(pick,'veg')) veg++; if(has(pick,'fisk')) fish++;
    });
    base.push(row);
  }
  return base;
}

  const prompt = 'Du lager handleliste for en norsk familie. Rett: «'+n+'». Porsjoner: '+CFG.servings+'.'+(url?' Oppskriftslenke (du kan ikke åpne den, men den kan si noe om varianten): '+url+'.':'')+

    ' "kjop" er varer som må kjøpes til denne retten. "skap" er basisvarer de fleste har hjemme: krydder, ris, pasta, mel, olje, buljong, hermetikk, løk og hvitløk. Bruk disse navnene på skapvarer når de passer: '+pantry+'.'+

    const kj=((r&&r.kjop)||[]).filter(o=>o&&o.navn).map(o=>line(o,true)); const sk=((r&&r.skap)||[]).filter(o=>o&&o.navn).map(o=>line(o,false));
    if(!kj.length && !sk.length){ st.textContent='Fikk ikke noe brukbart forslag. Prøv igjen.'; return; }

  }finally{ btn.disabled=false; }
}

}
const GUESS = [['f',/laks|torsk|sei\b|fisk|reke|makrell|ørret/],['k',/kjøtt|kylling|bacon|pølse|skinke|pepperoni|lam\b|svin|karbonade|kalkun|deig/],['m',/ost\b|ost |rømme|fløte|melk|yoghurt|crème|creme|smør|egg\b|parmesan|mozzarella|skyr|kesam/],['b',/brød|lefse|tortilla|naan|flatbrød|rundstykk|knekke|pita/],['z',/fryst|frossen|frosne|wokgrønnsaker|erter|pommes/],['t',/boks|saus|linser|bønner|pasta|nudler|ris\b|mel\b|krydder|syltetøy|hermetisk|kokosmelk|mais|sesam|hoisin|buljong|olje|chips/]];
function guessSec(n){ const l=n.toLowerCase(); for(const [s,re] of GUESS) if(re.test(l)) return s; return 'g'; }
function parseItems(txt, prev){
  const P = {}; (prev||[]).forEach(r=>{ P[r[0].toLowerCase()] = r[3]; });
  return txt.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
    let fresh = 0; if(/\*\s*$/.test(l)){ fresh = 1; l = l.replace(/\s*\*\s*$/,''); }
    const m = l.match(/^(.*?)\s+(\d+(?:[.,]\d+)?)\s*(kg|g|stk|pk|pakke|pakker|boks|bokser|pose|poser|glass|beger|bunt|bunter|bit|biter|flaske|flasker|potte|potter|fedd|terning|terninger|l|dl|ss|ts)?$/i);
    let name = l, q = null, u = '';
    if(m){ name = m[1]; q = parseFloat(m[2].replace(',','.')); u = (m[3]||'stk').toLowerCase(); if(u==='kg'){ q*=1000; u='g'; } const back={bokser:'boks',poser:'pose',bunter:'bunt',biter:'bit',flasker:'flaske',potter:'potte',pakke:'pk',pakker:'pk'}; u = back[u]||u; }
    const sec = P[name.toLowerCase()] || guessSec(name);
    const r = [name, q, u, sec]; if(fresh) r.push(1); return r;
  });
}

// ---------- Light Phone: ferdig utregnet ukeplan og handleliste ----------
// LP3-appen regner ikke selv. Den leser dokumentet «lp3», som siden skriver når noe endres.
// Avkrysninger fra LP3 skrives rett i ukedokumentene (w0–w3) med nøkkelen k, og «occ» sier hvilken runde uka gjelder.
function lp3Items(L, segs, wd){
  const groups = [];
  secOrder().forEach(s=>{
    const its = [];
    segs.forEach(sg=>Object.keys(L[sg]).forEach(k=>{ const it=L[sg][k]; if(it.s!==s) return;
      its.push({k:sg+'|'+k, b:it.basis||'', n:it.n, q:(it.qs!=null?it.qs:qtyStr(it.q,it.u)), done:!!wd.checked[sg+'|'+k], tag:it.tag||'', for:(it.for||[]).join(', '), seg:sg}); }));
    its.sort((a,b)=>a.n.localeCompare(b.n,'nb'));
    if(its.length) groups.push({s:secName(s), it:its});
  });
  return groups;
}

        shop: id==='rest' ? [] : lp3Items(buildList(w,[d],false), ['stor','paafyll'], wd)});
    }
    const L = buildList(w, null, false);
    weeks.push({w:w, occ:absFor(w), start:isoDate(ws), days:days, stor:lp3Items(L,['stor'],wd), paafyll:lp3Items(L,['paafyll'],wd)});
  }
  return {v:1, name:CFG.name||'', shop:DAYLONG[0], pad:CFG.padDay>=0?DAYLONG[CFG.padDay]:'', weeks:weeks};
}
let lp3Last = null, lp3Timer = null;
function scheduleLp3(){
  if(!db || !HID || !CFG.done) return;
  // Vent til alt er hentet fra serveren, så vi aldri lagrer en halvferdig plan for LP3.
  if(!DOCS.every(p=>UI.seen && UI.seen[p]) || !S.plan.base) return;
  clearTimeout(lp3Timer);
  lp3Timer = setTimeout(()=>{
    let js; try{ js = JSON.stringify(lp3Snapshot()); }catch(e){ return; }
    if(js===lp3Last) return; lp3Last = js;
    try{ db.doc('app/lp3').set({v:1, json:js, at:Date.now()}).catch(()=>{ lp3Last=null; }); }catch(e){ lp3Last=null; }
  }, 2500);
}

// ---------- Flytte inn en plan fra fil (f.eks. fra Claude-versjonen) ----------
const IMPORT_DOCS = ['setup','plan','basis','log','w0','w1','w2','w3'];
function parseImport(txt){ const o = JSON.parse(txt); if(!o || o.format!=='middagshjulet-1' || !isObj(o.docs) || !isObj(o.docs.setup)) throw new Error('format'); return o.docs; }
function applyImport(docs){ IMPORT_DOCS.forEach(k=>{ if(isObj(docs[k])) write('app/'+k, docs[k], true, {nolog:true}); }); UI.wiz=false; UI.tab='w'+(curW<0?0:curW); render(); }
function runPendingImport(){ let txt=null; try{ txt=localStorage.getItem('mh-import'); localStorage.removeItem('mh-import'); }catch(e){} if(!txt) return; try{ applyImport(parseImport(txt)); toast('Planen er flyttet inn.'); }catch(e){ toast('Fila kunne ikke leses. Ingenting er endret.'); } }
function readFile(input, cb){ const f = input.files && input.files[0]; if(!f) return; const r = new FileReader(); r.onload = ()=>cb(String(r.result||'')); r.onerror = ()=>toast('Fikk ikke lest fila.'); r.readAsText(f); }

// ---------- Felles lagring (Firebase) ----------
const foot = document.getElementById('foot');
foot.textContent = !HID ? '' : HAS_BACKEND ? 'Kobler til …' : 'Endringer lagres bare på denne enheten.';
const DOCS = ['app/setup','app/log','app/plan','app/basis','app/w0','app/w1','app/w2','app/w3'];
// Mangler et dokument på serveren, men denne enheten har innhold for det (lagret sist siden var åpen),
// lastes det opp igjen. Det reparerer planer som ikke ble lagret før feilen med lister i lister ble rettet.
const EMPTY = {'app/plan':'{"swaps":{},"custom":{},"edits":{}}','app/basis':'{"low":{},"fasteOff":{},"fasteAdd":{},"basisAdd":{},"basisOff":{}}','app/log':'{"items":[]}'};
const healed = {};
function healMissing(path, s){
  if(healed[path] || (s.metadata && s.metadata.fromCache) || !db) return;
  const local = docOf(path); const js = JSON.stringify(local||{});
  if(js==='{}' || js===EMPTY[path]) return;
  healed[path] = true;
  db.doc(path).set(clone(local)).catch(()=>{ healed[path]=false; });
}
function connect(adapter){
  db = adapter;
  foot.textContent = 'Lista deles live med alle i husstanden.';
  DOCS.forEach(path=>{
    try{ db.doc(path).onSnapshot(s=>{
      if(!(s.metadata && s.metadata.fromCache)){ UI.seen = UI.seen || {}; if(!UI.seen[path]){ UI.seen[path]=true; scheduleLp3(); } }
      if(path==='app/setup' && !UI.synced){ UI.synced=true; setTimeout(runPendingImport, 800); scheduleRender(); }
      if(!s.exists){ healMissing(path, s); return; } const js=JSON.stringify(s.data()); if(lastSnap[path]===js) return; lastSnap[path]=js; setDoc(path, JSON.parse(js)); saveLocal(); scheduleRender();
    }, e=>{ UI.connErr='Fikk ikke kontakt med lagringen. Sjekk nettet og prøv igjen.'; foot.textContent='Fikk ikke kontakt med lagringen.'; render(); }); }catch(_){}
  });
}
window.mhConnect = connect;
window.mhFail = msg => { UI.connErr = msg; foot.textContent = msg; render(); };
render();
if(HID && HAS_BACKEND){ if(window.mhStart) window.mhStart(HID); else window.addEventListener('mh-module-ready', ()=>window.mhStart && window.mhStart(HID), {once:true}); }
})();
</script>
<script type="module">
// Firebase: anonym innlogging + Firestore. Lenken (husstands-ID) bestemmer hvilken plan du ser.
const V = '10.12.2';
const cfg = window.FIREBASE_CONFIG;
async function start(hid){
  try{
    const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
    const { getAuth, signInAnonymously, onAuthStateChanged } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
    const { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, doc, setDoc, onSnapshot } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
    const app = initializeApp(cfg);
    const auth = getAuth(app);
    await new Promise((res, rej)=>{ const off = onAuthStateChanged(auth, u=>{ if(u){ off(); res(u); } }); signInAnonymously(auth).catch(rej); });
    let fs;
    try{ fs = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }
    catch(e){ fs = initializeFirestore(app, {}); }
    const ref = path => doc(fs, 'households', hid, 'docs', path.split('/')[1]);
    // Firestore kan ikke lagre lister rett inne i lister (f.eks. varelistene i retter: [["Løk",1,"stk","g"], …]).
    // Indre lister pakkes derfor inn som {_a:[…]} ved lagring og pakkes ut igjen ved lesing.
    const isO = v => v && typeof v === 'object' && !Array.isArray(v);
    const enc = v => Array.isArray(v) ? v.map(x => Array.isArray(x) ? {_a: enc(x)} : enc(x))
      : isO(v) ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, enc(x)])) : v;
    const dec = v => Array.isArray(v) ? v.map(dec)
      : isO(v) ? ((Object.keys(v).length === 1 && Array.isArray(v._a)) ? dec(v._a) : Object.fromEntries(Object.entries(v).map(([k, x]) => [k, dec(x)]))) : v;
    window.mhConnect({ doc: path => { const r = ref(path); return {
      set: d => setDoc(r, enc(d)),
      update: d => setDoc(r, enc(d), { merge: true }),
      // includeMetadataChanges: ellers kommer det ikke noe nytt varsel når data fra lageret på telefonen blir bekreftet
      // av serveren (bare metadata endres), og da vet ikke siden at den har ferske data å lagre LP3-planen fra.
      onSnapshot: (next, err) => onSnapshot(r, { includeMetadataChanges: true }, s => next({ exists: s.exists(), data: () => dec(s.data()), metadata: s.metadata }), err)
    }; } });
  }catch(e){
    window.mhFail && window.mhFail('Fikk ikke koblet til Firebase. Sjekk at oppsettet i firebase-config.js er riktig.');
    console.error(e);
  }
}
window.mhStart = start;
window.dispatchEvent(new Event('mh-module-ready'));
if('serviceWorker' in navigator){ window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
</script>
